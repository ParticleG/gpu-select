[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-select"
version = "0.1.0"
description = "Per-app GPU selection tool for Linux hybrid GPU laptops"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["tomlkit>=0.13"]

[project.scripts]
gpu-select = "gpu_select.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
